[package]
name = "manifex"
version = "0.3.0"
description = "Manifex – native Kubernetes management desktop application"
authors = ["Manifex Contributors"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.80"

[lib]
name = "manifex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-window-state = "2"
tauri-plugin-process = "2"

kube = { version = "5", default-features = false, features = ["client", "runtime", "ws", "rustls-tls", "ring", "gzip", "http-proxy", "socks5"] }
k8s-openapi = { version = "0.29", features = ["latest"] }

tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.41", features = ["bundled"] }
keyring = "4"
chacha20poly1305 = "0.10"
rand = "0.8"
base64 = "0.22"
flate2 = "1"
dirs = "6"
parking_lot = "0.12"
regex = "1"
http = "1"
tempfile = "3"
which = "7"
dashmap = "6"
secrecy = "0.10"
urlencoding = "2"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Keep debug builds small: full debug info only for our own crate.
[profile.dev.package."*"]
debug = false
