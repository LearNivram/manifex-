[package]
name = "manifex-agent"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
description = "In-cluster agent that exposes the Kubernetes API to Manifex through an authenticated TLS endpoint"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "signal", "time"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
http-body-util = "0.1"
bytes = "1"
subtle = "2"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
